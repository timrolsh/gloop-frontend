# wrangler.toml

# This is the name of your Worker.
name = "gloop-deployment"

# This is a required field for compatibility with Worker features.
compatibility_date = "2025-06-08"

[assets]
# This is the directory of static assets that yarn run build creates.
# For Create React App, this is "build". 
directory = "./build"

# This setting is CRITICAL for single-page applications like React.
# It ensures that any request that doesn't match a file (e.g., /dashboard, /profile)
# will serve your index.html file, allowing React Router to handle the routing.
not_found_handling = "single-page-application"